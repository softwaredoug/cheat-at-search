name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit tests
        run: uv run pytest tests/unit tests/e2e --cov=cheat_at_search --cov-report=term-missing --cov-report=xml

  integration-tests:
    runs-on: ubuntu-latest
    environment: openai-tests
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CHEAT_AT_SEARCH_DATA_PATH: ${{ github.workspace }}/data
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Cache datasets
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CHEAT_AT_SEARCH_DATA_PATH }}
            ~/.cache/huggingface
          key: datasets-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            datasets-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --dev

      - name: Run integration tests
        run: uv run pytest tests/integration -s
