[project]
name = "cheat_at_search"
version = "0.1.0"
description = "Cheat with LLMs example code"
authors = [
    {name = "Doug Turnbull",email = "softwaredoug@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0.0"
dependencies = [
    "pydantic (>=2.11.0,<3.0.0)",
    "pandas (>=2.2.0,<3.0.0)",
    "searcharray (>=0.0.73,<0.0.74)",
    "pystemmer (>=3.0.0,<4.0.0)",
    "sentence-transformers (>=5.0.0,<6.0.0)",
    "openai>=1.84.0,<3.0.0",
    "google-genai (>=1.2.0,<2.0.0)",
    "pyarrow (>=14.0.0,<22.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "lxml (>=6.0.2,<7.0.0)",
    "datasets (>=4.8.4,<5.0.0)",
    "huggingface-hub (>=0.30.0,<2.0.0)",
    "pillow (>=10.0.0,<12.0.0)",
    "platformdirs (>=4.0.0,<5.0.0)",
    "requests (>=2.31.0,<3.0.0)",
]

[dependency-groups]
dev = [
    "ipython>=9.3.0; python_version >= '3.11'",
    "pytest>=8.4.1,<9.0.0",
    "pre-commit>=4.0.1,<5.0.0",
    "flake8>=7.3.0,<8.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pillow>=10.0.0,<12.0.0",
    "google-cloud-storage>=3.13.1",
]

[tool.setuptools.packages.find]
include = ["cheat_at_search*"]

[tool.setuptools.package-data]
cheat_at_search = ["data/posts.json.gz"]

[tool.pylsp.plugins]
mypy.enabled = true
flake8.enabled = true
autopep8.enabled = false
yapf.enabled = false
black.enabled = false
pyright.enabled = false


[pycodestyle]
max-line-length = 120

[tool.pytest.ini_options]
markers = [
    "unit: fast tests that avoid external services",
    "integration: exercises real data/models or multi-module flows",
    "e2e: calls live providers or full pipelines",
    "benchmarks: long-running performance checks",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
