repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: uv-check-lock
        name: uv lock is current
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: flake8
        name: flake8
        entry: uv run flake8
        language: system
        types: [python]
      - id: pytest-unit
        name: pytest unit
        entry: uv run pytest tests/unit
        language: system
        pass_filenames: false
      - id: pytest-e2e
        name: pytest e2e
        entry: uv run pytest tests/e2e
        language: system
        pass_filenames: false
